name: cs1671project_env
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core data
      - numpy==2.4.4
      - pandas==3.0.2
      - scipy==1.17.1

      # Machine learning
      - scikit-learn==1.8.0
      - xgboost==3.2.0
      - shap==0.51.0

      # Deep learning
      - torch==2.11.0
      - transformers==5.6.2
      - tokenizers==0.22.2
      - safetensors==0.7.0
      - huggingface-hub==1.12.0

      # LLM API (LLaMA / Gemma via Pitt server)
      - openai==2.32.0

      # Utilities
      - tqdm==4.67.0
      - requests

      # Jupyter
      - ipykernel
      - jupyter-client
      - jupyter-core
